spring:
  datasource:
    url: jdbc:sqlite:file:rc-postflow-test?mode=memory&cache=shared
    driver-class-name: org.sqlite.JDBC
    hikari:
      maximum-pool-size: 1
      minimum-idle: 1

  jpa:
    database-platform: org.hibernate.community.dialect.SQLiteDialect

  flyway:
    locations: classpath:db/migration/sqlite

rc-postflow:
  security:
    admin:
      username: test-admin
      password: test-password

logging:
  file:
    name: ${java.io.tmpdir}/rc-postflow-test.log
